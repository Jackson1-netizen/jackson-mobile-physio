# Home Motion — reviewed integration source; account cutover is a separate action.
# Future production source: cto/home-motion-integration, after PR #10 review/merge.
# Never select the agent branch, legacy design branch or main for future production.
# This file does not change Netlify settings, publish, attach a domain or change DNS.
# Dashboard steps: docs/DEPLOYMENT.md
# HOME-002 non-production previews are prepared but disabled by default.
# Approval proposal: docs/STAGING_PREVIEW_PROPOSAL.md. No production-branch change.

[build]
  command = "npm run build"
  publish = "dist"
  # Exit 0 skips. Exit 1 builds. See scripts/netlify-ignore-build.mjs.
  ignore = "node scripts/netlify-ignore-build.mjs"

[build.environment]
  # package.json requires Node >= 22.12.0. No secrets belong here.
  NODE_VERSION = "22"

# Netlify sets CONTEXT=production for its configured production source.
[context.production]
  command = "npm run build"

# Pull requests into the production branch. Netlify sets CONTEXT=deploy-preview.
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Same command if Netlify selects the integration branch context.
[context."cto/home-motion-integration"]
  command = "npm run build"

# Security headers and X-Robots-Tag are written at build time
# by scripts/write-netlify-headers.mjs. While site.draft is true, the staging
# production deploy and its deploy previews are noindex.
