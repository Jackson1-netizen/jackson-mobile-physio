# Home Motion — Netlify free-plan preview only.
# Does not attach homemotionphysio.com.au. Does not change DNS. Does not deploy main.
# Dashboard steps: docs/DEPLOYMENT.md

[build]
  command = "npm run build"
  publish = "dist"
  # Exit 0 skips. Exit 1 builds. See scripts/netlify-ignore-build.mjs.
  ignore = "node scripts/netlify-ignore-build.mjs"

[build.environment]
  # package.json requires Node >= 22.12.0. No secrets belong here.
  NODE_VERSION = "22"

# Pull-request previews. Netlify sets CONTEXT=deploy-preview.
[context.deploy-preview]
  command = "npm run build"

# Branch deploys. Netlify sets CONTEXT=branch-deploy.
[context.branch-deploy]
  command = "npm run build"

# Steady preview of the approved design branch.
# Enable this branch under Branch deploys in the Netlify UI.
[context."cursor/design-option-2-b759"]
  command = "npm run build"

# Security headers and X-Robots-Tag are written at build time
# by scripts/write-netlify-headers.mjs. While site.draft is true, every
# allowed deploy is noindex. Deploy previews and the
# cursor/design-option-2-b759 branch deploy stay noindex even after that switch.
